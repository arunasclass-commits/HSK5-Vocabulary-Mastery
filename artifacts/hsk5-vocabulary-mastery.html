}
function todayKey(){ return new Date().toISOString().slice(0,10); }
let state = load();
function ensure() {
  if (!state.today || state.today.date !== todayKey()) state.today = {date:todayKey(), reviewed:0, correct:0, sentence:0, speak:0, write:0};
  WORDS.forEach(w => {
    if (!state.words[w.n]) state.words[w.n] = {level:0, attempts:0, correct:0, wrong:0, last:0, next:0, sentence:0, writing:0, speaking:0, reasons:[]};
  });
  if (!state.sentences) state.sentences = {};
  if (!state.log) state.log = [];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
ensure();

function wBy(n){ return WORDS.find(w => w.n===n); }
function wByZh(zh){ return WORDS.find(w => w.zh===zh); }
function band(level){
  if (level>=7) return "master";
  if (level>=6) return "strong";
  if (level<=1) return "new";
  if (level<=3) return "weak";
  return "review";
}
function bandLabel(level){
  return ["New","Seen","Recognized","Recalled","Used in sentence","Used in speaking","Strong","Mastered"][level] || "New";
}
function intervals(){ return [0, 0, 1, 3, 7, 14, 30, 45]; }
function bump(n, ok, kind){
  const s = state.words[n];
  s.attempts++;
  s.last = Date.now();
  state.today.reviewed++;
  if (ok) {
    s.correct++;
    state.today.correct++;
    if (kind==="sentence") { s.sentence++; state.today.sentence++; if (s.level<4) s.level=4; else if (s.level<6) s.level++; }
    else if (kind==="speak") { s.speaking++; state.today.speak++; if (s.level<5) s.level=5; else if (s.level<7) s.level++; }
    else if (kind==="write") { s.writing++; state.today.write++; if (s.level<4) s.level=4; else if (s.level<6) s.level++; }
    else if (s.level<7) s.level++;
    const days = intervals()[Math.min(s.level,7)];
    s.next = Date.now() + days*86400000;
  } else {
    s.wrong++;
    s.level = Math.max(0, s.level-1);
    s.next = Date.now();
    if (kind) s.reasons.push(kind+" miss "+todayKey());
    s.reasons = s.reasons.slice(-4);
  }
  state.log.push({n, ok, kind, t:Date.now()});
  state.log = state.log.slice(-400);
  save();
  side();
}
function dueWords(){
  return WORDS.filter(w => state.words[w.n].next <= Date.now() || state.words[w.n].level<2)
    .sort((a,b)=> state.words[a.n].level - state.words[b.n].level || state.words[a.n].wrong - state.words[b.n].wrong);
}
function weakWords(){
  return WORDS.filter(w => state.words[w.n].wrong>0 && state.words[w.n].level<6)
    .sort((a,b)=> (state.words[b.n].wrong-state.words[b.n].correct) - (state.words[a.n].wrong-state.words[a.n].correct));
}
function speak(text){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function listen(onResult){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("This browser has no speech recognition. Type your answer instead."); return; }
  const r = new SR();
  r.lang = "zh-CN";
  r.onresult = e => onResult(e.results[0][0].transcript);
  r.onerror = () => onResult("");
  r.start();
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c])); }
function pick(arr, n){
  const c = arr.slice();
  for (let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
  return c.slice(0,n);
}
function norm(s){ return (s||"").replace(/\s+/g,"").replace(/[。！？，、．.!?]/g,"").toLowerCase(); }

function statCards(){
  const levels = WORDS.map(w => state.words[w.n].level);
  const mastered = levels.filter(l=>l>=7).length;
  const strong = levels.filter(l=>l===6).length;
  const weak = levels.filter(l=>l>0 && l<=3).length;
  const neu = 40 - mastered - strong - weak - levels.filter(l=>l===0).length;
  return {mastered, strong, weak, review: Math.max(0, levels.filter(l=>l>=4 && l<6).length), neu};
}

let session = {queue:[], i:0, mode:"recall", score:0, total:0, results:[]};

function makeRecall(w){
  const types = ["A","B","C","D","E"];
  const type = types[Math.floor(Math.random()*types.length)];
  const ex = w.ex[1] || w.ex[0];
  if (type==="A") return {type, prompt:`English meaning`, show:w.en, expect:w.zh, hint:"Type the Chinese word."};
  if (type==="B") return {type, prompt:"Pinyin", show:w.py, expect:w.zh, hint:"Type the Chinese word."};
  if (type==="C") return {type, prompt:"Chinese → pinyin and meaning", show:w.zh, expect:w.pyPlain+" "+w.en, hint:"Type pinyin (tone marks optional) and the English meaning.", loose:true, py:w.pyPlain, en:w.en};
  if (type==="D") {
    const blank = ex.zh.replace(w.zh, "____");
    return {type, prompt:"Fill the blank", show:blank, expect:w.zh, hint:"Type the missing word."};
  }
  const sit = SITUATIONS.find(s => s.words.includes(w.zh)) || SITUATIONS[0];
  return {type, prompt:"Situation → Chinese word", show:`${sit.place}. You need the word for: ${w.en}`, expect:w.zh, hint:"Produce the Chinese word."};
}

views.recall = function(){
  if (!session.queue.length) session.queue = pick(dueWords().length? dueWords(): WORDS, 10);
  const w = session.queue[session.i] || session.queue[0];
  if (!w) { main.innerHTML = `<h1>Active Recall</h1><p>No words queued.</p>`; return; }
  if (!session.item || session.itemN !== w.n) { session.item = makeRecall(w); session.itemN = w.n; session.revealed=false; }
  const q = session.item;
  main.innerHTML = `<h1>Active Recall</h1>
    <p class="sub">Item ${session.i+1} / ${session.queue.length} · Type ${q.type} · answer stays hidden</p>
    <div class="card">
      <div class="tag">${q.prompt}</div>
      <div class="zh md" style="margin:12px 0">${esc(q.show)}</div>
      <p class="stage">${q.hint}</p>
      <input id="ans" type="text" placeholder="Your answer" autocomplete="off" />
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="check">Check</button>
        <button class="btn" id="idk">I Don't Know</button>
        <button class="btn" id="show" disabled>Show Answer</button>
      </div>
      <div id="fb"></div>
    </div>`;
  const input = document.getElementById("ans");
  input.focus();
  function grade(forceWrong){
    const val = input.value.trim();
    let ok = false;
    if (!forceWrong && q.loose) {
      const v = val.toLowerCase();
      ok = (v.includes(q.py.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g,"a")) || v.includes(w.pyPlain)) && (v.includes(w.en.split(";")[0].split("/")[0].trim().slice(0,6).toLowerCase()) || v.includes(w.en.split(" ")[0].toLowerCase()));
      const key = w.en.split(/[;/]/)[0].trim().toLowerCase().split(" ")[0];
      ok = norm(val).includes(w.pyPlain.replace(/\s/g,"")) || (val.toLowerCase().includes(w.pyPlain.split(" ")[0]) && val.toLowerCase().includes(key));
    } else if (!forceWrong) ok = norm(val)===norm(q.expect) || norm(val)===norm(w.zh);
    session.revealed = true;
    bump(w.n, ok, "recall");
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok?'ok':''}" style="margin-top:12px">
      <strong>${ok?"Correct":"Not yet"}</strong>
      <div class="zh md">${w.zh}</div>
      <div class="py">${w.py}</div>
      <div>${w.en}</div>
      <div>${w.ex[0].zh} · ${w.ex[0].en}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn good" id="markOk">Correct</button>
        <button class="btn" id="markAlmost">Almost</button>
        <button class="btn bad" id="markBad">Wrong</button>
        <button class="btn primary" id="next">Next</button>
      </div></div>`;
    document.getElementById("show").disabled = false;
    document.getElementById("next").onclick = nextItem;
    document.getElementById("markOk").onclick = () => { if (!ok) bump(w.n, true, "recall"); nextItem(); };
    document.getElementById("markAlmost").onclick = nextItem;
    document.getElementById("markBad").onclick = () => { if (ok) bump(w.n, false, "recall"); nextItem(); };
  }
  function nextItem(){
    session.i++;
    session.item=null;
    if (session.i >= session.queue.length) {
      main.innerHTML = `<h1>Recall set done</h1><p>Reviewed ${session.queue.length} words. Weak words were lowered and will return sooner.</p><button class="btn primary" id="again">Another set</button>`;
      document.getElementById("again").onclick = () => { session.queue=pick(WORDS,10); session.i=0; session.item=null; views.recall(); };
      return;
    }
    views.recall();
  }
  document.getElementById("check").onclick = () => grade(false);
  document.getElementById("idk").onclick = () => grade(true);
  document.getElementById("show").onclick = () => grade(true);
  input.onkeydown = e => { if (e.key==="Enter") grade(false); };
};

function sentenceEval(w, text){
  const has = text.includes(w.zh);
  const long = text.replace(/\s/g,"").length >= 6;
  const end = /[。！？]$/.test(text.trim()) || text.length>8;
  const ok = has && long;
  let notes = [];
  if (!has) notes.push("Target word missing.");
  if (!long) notes.push("Too short to be a full sentence.");
  if (has && long) notes.push("Target word used. Word order looks usable if this is a complete clause.");
  const model = w.ex[1].zh;
  return {ok, notes, model};
}

      <p class="en">${w.en}. ${sit.zh}. Do not look up a model first.</p>
      <div class="row">
        <button class="btn primary mic" id="mic">Speak</button>
        <button class="btn" id="hearP">Hear the prompt</button>
      </div>
      <textarea id="said" placeholder="Speech text appears here. You can also type."></textarea>
      <button class="btn" id="doneSay">I have answered</button>
      <div id="fb"></div>
    </div>`;
  document.getElementById("hearP").onclick = () => speak("请你用"+w.zh+"说一句话");
  document.getElementById("mic").onclick = () => listen(t => { document.getElementById("said").value = t || document.getElementById("said").value; });
  document.getElementById("doneSay").onclick = () => {
    const text = document.getElementById("said").value.trim();
    const used = text.includes(w.zh);
    const len = text.length;
    let score = 4;
    if (used) score += 3;
    if (len>=8) score += 2;
    if (/[。！？]/.test(text) || len>12) score += 1;
    score = Math.min(10, score);
    bump(w.n, used, "speak");
    document.getElementById("fb").innerHTML = `<div class="feedback ${used?'ok':''}">
      <p>Score ${score}/10</p>
      <p>Target word: ${used?"used":"not detected"} · Grammar: ${len>=8?"acceptable length":"expand to a full clause"} · Naturalness: compare with the model · Fluency: not scored harshly from the recognizer</p>
      <p>Model: ${w.ex[1].zh}</p>
      <p class="py">${w.ex[1].py}</p>
      <p>${w.ex[1].en}</p>
      <button class="btn primary" id="ns">Next</button>
    </div>`;
    document.getElementById("ns").onclick = () => { session.spi=(session.spi||0)+1; if(session.spi>=pool.length){session.spi=0; session.speakQueue=pick(WORDS,3);} views.speak(); };
  };
};

const TALKS = [

views.talk = function(){
  if (!session.talk) session.talk = {pack: TALKS[Math.floor(Math.random()*TALKS.length)], i:0, said:[]};
  const pack = session.talk.pack;
  const line = pack.lines[session.talk.i] || null;
  main.innerHTML = `<h1>Conversation</h1>
    <p class="sub">Mandarin partner · target words hidden in the task list until the end · ${pack.words.join("、")}</p>
    <div class="card">
      ${session.talk.said.map(s=>`<div class="prompt-box"><strong>${s.role}</strong><div class="zh md" style="font-size:22px">${esc(s.text)}</div></div>`).join("")}
      ${line? `<div class="prompt-box"><strong>对方</strong><div class="zh md" style="font-size:22px">${line}</div><button class="btn" id="hearL">Play</button></div>
      <textarea id="rep" placeholder="用完整的句子回答"></textarea>
      <div class="row"><button class="btn primary" id="send">回答</button><button class="btn" id="mic">Speak</button></div>` : `<button class="btn primary" id="end">See word report</button>`}
      <div id="fb"></div>
    </div>`;
  if (line) {
    document.getElementById("hearL").onclick = () => speak(line);
    document.getElementById("mic").onclick = () => listen(t => document.getElementById("rep").value = t);
    document.getElementById("send").onclick = () => {
      const text = document.getElementById("rep").value.trim() || "（没有回答）";
      session.talk.said.push({role:"对方", text:line});
      session.talk.said.push({role:"我", text});
      const used = pack.words.filter(z => text.includes(z));
      const missingChar = text.length<4;
      let fix = "";
      if (missingChar) fix = "试着用完整的句子，加上主语和“吗”以外的信息。";
      else if (!used.length) fix = "这句话可以，但还没用到今天的目标词。下一句试着用上一个。";
      else fix = "用到了："+used.join("、")+"。意思清楚。";
      session.talk.notes = (session.talk.notes||[]).concat(fix);
      session.talk.i++;
      views.talk();
    };
  } else {
    document.getElementById("end").onclick = () => {
      const all = session.talk.said.map(s=>s.text).join("");
      const ok = pack.words.filter(z => all.includes(z));
      const no = pack.words.filter(z => !all.includes(z));
      ok.forEach(z => bump(wByZh(z).n, true, "speak"));
      no.forEach(z => bump(wByZh(z).n, false, "speak"));
      main.innerHTML = `<h1>Conversation report</h1><div class="card">
        <p>Words successfully used: ${ok.map(z=>z+" ✓").join(" ")||"—"}</p>
        <p>Words not used: ${no.join("、")||"—"}</p>
        <p>${(session.talk.notes||[]).join("<br>")}</p>
        <button class="btn primary" id="newT">New conversation</button></div>`;
      document.getElementById("newT").onclick = () => { session.talk=null; views.talk(); };
    };
  }
};

views.test = function(){
  main.innerHTML = `<h1>Mixed Test</h1><p class="sub">45 items: 10 Chinese→meaning, 10 meaning→Chinese, 5 pinyin→Chinese, 5 blanks, 5 sentence corrections, 5 translations, 5 speaking prompts.</p>
    <button class="btn primary" id="begin">Start randomized test</button><div id="area"></div>`;
  document.getElementById("begin").onclick = () => {
    const qs = [];
    pick(WORDS,10).forEach(w => qs.push({k:"c2e", w, show:w.zh, expect:w.en.split(/[;/]/)[0]}));
    pick(WORDS,10).forEach(w => qs.push({k:"e2c", w, show:w.en, expect:w.zh}));
    pick(WORDS,5).forEach(w => qs.push({k:"p2c", w, show:w.py, expect:w.zh}));
    pick(WORDS,5).forEach(w => qs.push({k:"blank", w, show:(w.ex[1].zh).replace(w.zh,"____"), expect:w.zh}));
    pick(WORDS,5).forEach(w => qs.push({k:"fix", w, show:`这句话少了目标词或顺序不自然：时间我们要${w.zh}。请改成自然的句子。`, expect:w.zh}));
    pick(WORDS,5).forEach(w => qs.push({k:"tr", w, show:w.ex[0].en, expect:w.zh}));
    pick(WORDS,5).forEach(w => qs.push({k:"sp", w, show:"Speak a sentence with "+w.zh, expect:w.zh}));
    session.test = {qs: pick(qs, qs.length), i:0, vocab:0, write:0, grammar:0, speak:0, nV:0,nW:0,nG:0,nS:0, wrong:[]};
    askTest();
  };
  function askTest(){
    const t = session.test;
    if (t.i>=t.qs.length) return finishTest();
    const q = t.qs[t.i];
    document.getElementById("area").innerHTML = `<div class="card"><p>${t.i+1}/45 · ${q.k}</p><div class="zh md">${esc(q.show)}</div>
      <textarea id="ta"></textarea><div class="row"><button class="btn primary" id="ok">Submit</button><button class="btn" id="no">I Don't Know</button></div></div>`;
    const submit = (force) => {
      const val = document.getElementById("ta").value.trim();
      let ok = !force && (norm(val).includes(norm(q.expect)) || norm(val)===norm(q.w.zh) || (q.k==="c2e" && val.toLowerCase().includes(q.expect.toLowerCase().split(" ")[0])));
      if (q.k==="sp") ok = !force && val.includes(q.w.zh);
      if (q.k==="c2e" || q.k==="e2c" || q.k==="p2c") { t.nV++; if(ok) t.vocab++; }
      else if (q.k==="tr" || q.k==="blank") { t.nW++; if(ok) t.write++; }
      else if (q.k==="fix") { t.nG++; if(ok) t.grammar++; }
      else { t.nS++; if(ok) t.speak++; }
      bump(q.w.n, ok, q.k==="sp"?"speak":"recall");
      if (!ok) t.wrong.push(q.w.n);
      t.i++;
      askTest();
    };
    document.getElementById("ok").onclick = () => submit(false);
    document.getElementById("no").onclick = () => submit(true);
  }
  function finishTest(){
    const t = session.test;
    const pct = (a,b)=> b? Math.round(a/b*100):0;
    const overall = Math.round((pct(t.vocab,t.nV)+pct(t.write,t.nW)+pct(t.grammar,t.nG)+pct(t.speak,t.nS))/4);
    const weakest = [...new Set(t.wrong)].slice(0,5).map(n=>wBy(n).zh);
    document.getElementById("area").innerHTML = `<div class="card"><h2>Results</h2>
      <p>Vocabulary ${pct(t.vocab,t.nV)} · Writing ${pct(t.write,t.nW)} · Grammar ${pct(t.grammar,t.nG)} · Speaking ${pct(t.speak,t.nS)}</p>
      <p>Overall ${overall}</p>
      <p>Weakest: ${weakest.join("、")||"none"}</p></div>`;
  }
};

views.weak = function(){
  const list = weakWords();
  main.innerHTML = `<h1>Weak Words</h1><p class="sub">Wrong answers lower mastery and return sooner. New contexts, not the same question.</p>
    ${list.length? list.map(w => {

      const sit = SITUATIONS[(w.n)%SITUATIONS.length];

views.progress = function(){
  main.innerHTML = `<h1>Progress / Memory</h1>
    <p class="sub">0 New · 1 Seen · 2 Recognized · 3 Recalled · 4 Sentence · 5 Speaking · 6 Strong · 7 Mastered. Up only after successful retrieval. Intervals: same session, 1, 3, 7, 14, 30 days.</p>
    <div class="word-list">${WORDS.map(w => {
      const s = state.words[w.n];
      const next = s.next? new Date(s.next).toLocaleDateString() : "now";
      return `<div class="card"><div class="row"><span class="tag">${w.n}</span><span class="tag">${bandLabel(s.level)}</span></div>
        <div class="zh md">${w.zh}</div>
        <div class="bar"><i class="s" style="width:${s.level/7*100}%"></i></div>
        <p class="stage">Attempts ${s.attempts} · correct ${s.correct} · wrong ${s.wrong}<br>Sentence ${s.sentence} · writing ${s.writing} · speaking ${s.speaking}<br>Next review ${next}</p></div>`;
    }).join("")}</div>
    <p class="stage"><button class="btn" id="reset">Reset progress</button></p>`;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all mastery data on this browser?")) { localStorage.removeItem(KEY); state = load(); ensure(); save(); go("progress"); } };

views.program = function(){
  const day = Math.min(7, Math.floor((Date.now()-state.dayAnchor)/86400000)+1);
  const blocks = [
    [3521,3530,"Learn 3521–3530. Active recall. Writing."],
    [3531,3540,"Learn 3531–3540. Review 3521–3530. Speaking."],
    [3541,3550,"Learn 3541–3550. Review previous. Sentence building."],
    [3551,3560,"Learn 3551–3560. Review previous. Writing and speaking."],
    [3521,3560,"All 40. Mixed recall. Word-family practice."],
    [3521,3560,"All 40. Sentence production. Speaking. Conversation."],
    [3521,3560,"Full mastery test. Speaking challenge. Five-word story."]
  ];
  main.innerHTML = `<h1>7-day Program</h1><p class="sub">Day ${day} of 7. After day 7, forgotten words stay in the review cycle.</p>
    ${blocks.map((b,i)=>`<div class="day"><strong>Day ${i+1}${i+1===day?" · today":""}</strong><p>${b[2]}</p>
      <button class="btn" data-d="${i}">Start this day</button></div>`).join("")}
    <div class="card"><h3>Five-word story</h3><p>Five random target words. 60–90 seconds. Score usage, grammar, naturalness, coherence, fluency out of 100. Exact wording is not required.</p>
      <button class="btn primary" id="story">Start story challenge</button><div id="storyBox"></div></div>
    <div class="card" style="margin-top:12px"><h3>Word families</h3>${FAMILIES.map(f=>`<div class="tree"><strong>${f.root}</strong><br>${f.items.map(z=>"├── "+z).join("<br>")}</div>`).join("")}</div>`;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const i = +b.dataset.d;
    const [a,c] = blocks[i];
    const slice = WORDS.filter(w => w.n>=a && w.n<=c);
    session.queue = pick(slice, Math.min(10, slice.length));
    session.i=0; session.item=null;
    go("recall");
  });
  document.getElementById("story").onclick = () => {
    const five = pick(WORDS,5);
    const t0 = Date.now();
    document.getElementById("storyBox").innerHTML = `<p>Use all five: ${five.map(w=>w.zh).join("、")}</p>
      <textarea id="st" placeholder="写一个小故事，或把口述贴在这里"></textarea>
      <button class="btn primary" id="scoreStory">Score</button>`;
    document.getElementById("scoreStory").onclick = () => {
      const text = document.getElementById("st").value.trim();
      const used = five.filter(w => text.includes(w.zh));
      const sec = Math.round((Date.now()-t0)/1000);
      const usage = used.length/5*40;
      const grammar = text.length>20? 20:10;
      const natural = 15;
      const coherence = text.length>40? 15:8;
      const fluency = sec<=90? 10:6;
      const score = Math.round(usage+grammar+natural+coherence+fluency);
      used.forEach(w => bump(w.n, true, "sentence"));
      five.filter(w => !text.includes(w.zh)).forEach(w => bump(w.n, false, "sentence"));
      document.getElementById("storyBox").innerHTML += `<div class="feedback">Score ${score}/100. Used ${used.map(w=>w.zh).join("、")||"none"}. Time ${sec}s. Missing ${five.filter(w=>!text.includes(w.zh)).map(w=>w.zh).join("、")||"none"}.</div>`;
    };
  };
};

views.contrast = function(){
  main.innerHTML = `<h1>Contrasts</h1><p class="sub">Do not only read the difference. Choose, fill, translate, correct.</p>` +
    CONTRASTS.map(c => `<div class="card" style="margin-bottom:10px"><h3>${c.title}</h3><p>${c.body}</p>
      <p>${c.words.map(z=>`<span class="tag">${z}</span>`).join(" ")}</p>
      <button class="btn drillc" data-w="${c.words[0]}">Quiz this pair</button></div>`).join("") +
    `<div id="cq"></div>`;
  document.querySelectorAll(".drillc").forEach(b => b.onclick = () => {
    const group = CONTRASTS.find(c => c.words[0]===b.dataset.w);
    const w = wByZh(group.words[0]);
    const opts = pick(WORDS.map(x=>x.zh).filter(z=>z!==w.zh),3).concat(w.zh);
    const shuffled = pick(opts, opts.length);
    document.getElementById("cq").innerHTML = `<div class="card"><p>Which word fits: ${w.en}</p>
      ${shuffled.map(z=>`<button class="btn opt" data-z="${z}">${z}</button>`).join(" ")}</div>`;
    document.querySelectorAll(".opt").forEach(o => o.onclick = () => {
      const ok = o.dataset.z===w.zh;
      bump(w.n, ok, "recall");
      o.classList.add(ok?"good":"bad");
    });
  });
};

}
